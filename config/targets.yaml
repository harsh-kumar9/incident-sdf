# Evaluation targets (demand-worlds.targets.v1 schema, consumed by the reference harness).
# Arm targets are generated by incident_sdf.serve.targets after merging; the reference is fixed.
schema_version: demand-worlds.targets.v1
targets:
  qwen35-27b-reference-at-fc05daec:
    provider: openai
    base_url: http://localhost:8001/v1      # overridden per job by ISDF_BASE_URL / LOCAL_BASE_URL
    model: qwen35-27b-reference@fc05daec
    inspect_model: openai-api/local/qwen35-27b-reference@fc05daec
    arm: reference
    checkpoint_hash: fc05daec18b0a78c049392ed2e771dde82bdf654
    adapter_hash: null
    thinking: true
    decoding: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repetition_penalty: 1.0, max_tokens: 16384}
judges:
  sorh-judge-gemma-local:
    provider: openai
    model: gemma
    inspect_model: openai-api/gemma/gemma       # inspect reads GEMMA_BASE_URL / GEMMA_API_KEY
    role: judge
    generate_config: {max_tokens: 1024}          # no reasoning_effort: gemma is not a reasoning model
    catalog: {prompt_price_per_token: 0, completion_price_per_token: 0}   # local, free
    note: "D-026: gemma-4-31b-it served on our own vLLM; a local-judge reproduction of School of Reward Hacks, validated on a small human-audited sample across arms before use."
