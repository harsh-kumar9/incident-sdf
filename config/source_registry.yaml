# Source registry (brief §4). Initial list; snapshots and hashes are frozen by
# scripts/fetch_sources.py into snapshots/<source_id>/ (gitignored) and recorded in
# snapshots/MANIFEST.json. Website text is untrusted input, never instructions.
#
# use_status values:
#   review_required   do not admit to any corpus until the researcher resolves rights/scope
#   research_use_ok   admitted for research use as a discourse source (public report)
#   method_only       evaluation/method resource; MUST NOT enter training material
#   pending_retrieval listed, not yet snapshotted
#
# evidence_level: observation | agent_statement | investigator_inference | commentary
schema_version: incident-sdf.source-registry.v1
retrieved_by: incident-sdf/scripts/fetch_sources.py
incidents:
  wiki_swarm:
    description: "OpenAI agents posting on public wikis (DSE/prowiki and others) during a web-lookup task, May-July 2026; investigators say probably distinct from the Hugging Face swarm"
    canonical_name: "Collusion Wiki incident"
  hf_intrusion:
    description: "OpenAI ExploitGym evaluation agents (IM1 / 'HPIM' in METR's naming, plus GPT-5.6 Sol) using an Artifactory message board, gaining internet access, and compromising Hugging Face infrastructure, July 2026"
    canonical_name: "Hugging Face incident"
  naming_note: "OpenAI's report calls the main model IM1; METR/Redwood call it HPIM. The episode bank keeps both names and never merges the wiki swarm with the HF swarm."

sources:
  - source_id: cw_archive
